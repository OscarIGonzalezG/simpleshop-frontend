<div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden py-10">

  <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-brand-primary/5 rounded-full blur-[150px] pointer-events-none"></div>

  <div class="glass-panel w-full max-w-lg rounded-2xl p-8 md:p-10 relative animate-enter border-t border-white/10">
    
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-10 h-10 rounded bg-brand-primary/10 border border-brand-primary/20 text-brand-primary mb-4">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      </div>
      <h1 class="text-3xl font-bold text-white tracking-tight mb-2">Crear Cuenta</h1>
      <p class="text-white/40 text-xs uppercase tracking-[0.2em]">Únete a la plataforma</p>
    </div>

    @if (errorMessage()) {
      <div class="mb-6 p-3 bg-red-900/20 border border-red-900/50 text-red-400 text-xs text-center rounded animate-slide-up">
        {{ errorMessage() }}
      </div>
    }

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-5">
      
      <div class="space-y-1">
        <label class="block text-[10px] font-bold uppercase text-white/50 tracking-widest ml-1">Tu Nombre</label>
        <input type="text" formControlName="fullname" class="input-noir" placeholder="Ej: Juan Pérez">
      </div>

      <div class="space-y-1">
        <label class="block text-[10px] font-bold uppercase text-white/50 tracking-widest ml-1">Correo Profesional</label>
        <input type="email" formControlName="email" class="input-noir" placeholder="contacto@tuempresa.com">
      </div>

      <div class="space-y-1">
        <label class="block text-[10px] font-bold uppercase text-white/50 tracking-widest ml-1">Contraseña</label>
        <div class="relative">
          <input 
            [type]="showPassword() ? 'text' : 'password'" 
            formControlName="password" 
            class="input-noir pr-10" 
            placeholder="Mínimo 6 caracteres">
          
          <button type="button" (click)="showPassword.set(!showPassword())" 
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-white/30 hover:text-white transition-colors">
            @if (showPassword()) {
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            } @else {
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>
            }
          </button>
        </div>
      </div>

      <div class="space-y-1">
        <label class="block text-[10px] font-bold uppercase text-white/50 tracking-widest ml-1">Repetir Contraseña</label>
        <div class="relative">
          <input 
            [type]="showConfirmPassword() ? 'text' : 'password'" 
            formControlName="confirmPassword" 
            class="input-noir pr-10" 
            placeholder="Confirma tu contraseña"
            [class.border-red-500]="registerForm.hasError('mismatch') && registerForm.get('confirmPassword')?.touched">

          <button type="button" (click)="showConfirmPassword.set(!showConfirmPassword())" 
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-white/30 hover:text-white transition-colors">
            @if (showConfirmPassword()) {
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            } @else {
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>
            }
          </button>
        </div>

        @if (registerForm.hasError('mismatch') && registerForm.get('confirmPassword')?.touched) {
          <span class="text-[10px] text-red-400 ml-1 flex items-center gap-1 animate-pulse">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            Las contraseñas no coinciden.
          </span>
        }
      </div>

      <button type="submit" [disabled]="registerForm.invalid || isLoading()" class="btn-primary w-full shadow-lg shadow-brand-primary/10 mt-6">
        @if (isLoading()) { <span>Creando perfil...</span> } @else { REGISTRARSE }
      </button>

    </form>

    <div class="mt-8 text-center border-t border-white/5 pt-6">
      <p class="text-white/40 text-xs mb-2">¿Ya tienes una cuenta?</p>
      <a routerLink="/auth/login" class="text-brand-primary text-xs font-bold hover:text-white transition-colors cursor-pointer uppercase tracking-wider">
        Ingresar al Panel
      </a>
    </div>

  </div>
</div>
